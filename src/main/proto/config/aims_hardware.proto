syntax = "proto3";

package com.jingyicare.jingyi_aims_engine.proto.config;

message SurgeryAreaConfigPB {
    int32 id = 1;
    int32 dept_id = 2;
    string area_name = 3;
    int32 area_type = 4;
    int32 authorization_type = 5;
    int32 display_order = 6;
}

message DeviceInfoPB {
    int32 id = 1;
    int32 dept_id = 2;
    string device_sn = 4;
    string device_type = 5;
    string device_name = 6;
    string device_ip = 7;
    string device_port = 8;
    string device_driver_code = 9;
    int32 source_mode = 10;
    int32 source_topology = 11;
    int32 upstream_device_id = 12;
    int32 pds_ip_seq = 13;
}

message DeviceModelPB {
    int32 id = 1;
    string model = 2;
    string driver_code = 3;
}

message ManufacturerPB {
    int32 id = 1;
    string name = 2;
    repeated DeviceModelPB model = 3;
}

message DeviceTypeEntryPB {
    int32 device_type_id = 1;
    string device_type_name = 2;
    repeated ManufacturerPB manufacturer = 3;
}

message DeviceCascadePB {
    repeated DeviceTypeEntryPB entry = 1;
}

message HardwareConfigPB {
    DeviceCascadePB device_cascade = 1;
}

message DevObservationItemPB {
    string ob_code = 1;
    string monitoring_param_code = 2;
}

message DevObsPagePB {
    string page_name = 1;
    repeated DevObservationItemPB item = 2;
}

message DevObservationConfigPB {
    string driver_code = 1;
    string hl7_bed_number_path = 2;
    string hl7_ob_path_prefix = 3;
    string hl7_ob_code_path = 4;
    string hl7_ob_value_path = 5;
    string hl7_ob_value_at_path = 6;
    repeated DevObservationItemPB item = 7;
    repeated DevObsPagePB obs_page = 8;
}

message DevObservationConfigsPB {
    repeated DevObservationConfigPB config = 1;
}
