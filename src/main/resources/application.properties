spring.application.name=aims_jd
server.port=8084

# spring
spring.profiles.active=prod
logging.level.org.springframework.security=INFO
management.endpoints.web.exposure.include=prometheus,health,info,metrics,env
management.endpoint.env.keys-to-sanitize=DO_NOT_MATCH_ANYTHING
management.endpoint.env.show-values=ALWAYS

# AIMS database
spring.datasource.url=jdbc:postgresql://localhost:5432/jingyi_aims
spring.datasource.username=postgres
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver
aims.engine.schema=public
aims.jd.schema=aims_jd

# device refresh
device.sync.interval_mins=1
device.sync.await_termination_seconds=30
device.heartbeat.interval_ms=1000
device.driver.txt=classpath:/config/device_driver.txt

# tcp generic
tcp.receive_timeout_ms=10000
tcp.send_timeout_ms=2000

# tcp server module
tcp.server.port=50005
tcp.server.select_timeout_ms=1000
tcp.server.selector_thread_join_timeout_ms=180000

# outbound client
outbound.connect.timeout_ms=5000
outbound.read.timeout_ms=1500
outbound.reconnect.interval_ms=5000

# BLT Q5
bltq5.heartbeat.enabled=true
bltq5.heartbeat.interval_ms=1000
bltq5.query.enabled=true
bltq5.query.interval_ms=1000
bltq5.query.timestamp_suffix=true

# mindray pds
mindray.pds.enabled=false
mindray.pds.sync.interval_ms=5000
mindray.pds.bedlist.port=4678
mindray.pds.bedlist.connect_timeout_ms=5000
mindray.pds.bedlist.read_timeout_ms=1500
mindray.pds.bedlist.collect_window_ms=3000
mindray.pds.realtime.port=4601
mindray.pds.realtime.connect_timeout_ms=5000
mindray.pds.realtime.read_timeout_ms=1500
mindray.pds.realtime.echo_interval_ms=1000
mindray.pds.realtime.reconnect_delay_ms=3000
mindray.pds.realtime.send_type=1
mindray.pds.realtime.send_freq=1
mindray.pds.realtime.send_all=1
mindray.pds.realtime.param_list=
mindray.pds.realtime.max_sessions_per_source=256

# 连接线程池
conn.threadpool.size=100
conn.threadpool.queue_capacity=10000
conn.threadpool.keepalive_seconds=120
conn.threadpool.await_termination_seconds=60

# txtdumper
txtdumper.path=
txtdumper.queue.size=2048
